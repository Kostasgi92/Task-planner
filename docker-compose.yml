# Local Postgres for development. The init script mirrors Neon: the app connects as a
# non-superuser owner role, so row-level security is exercised exactly as in production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
