name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Non-superuser owner, like Neon's, so row-level security is really exercised.
      TEST_DATABASE_URL: postgres://tasknest_owner:tasknest@localhost:5432/tasknest_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE tasknest_owner LOGIN CREATEROLE PASSWORD 'tasknest';"
          psql -h localhost -U postgres -c "CREATE DATABASE tasknest_test OWNER tasknest_owner;"
          psql -h localhost -U postgres -d tasknest_test -c "ALTER SCHEMA public OWNER TO tasknest_owner;"
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Contracts are up to date with openapi.yaml
        run: pnpm codegen && git diff --exit-code packages/contracts/src/generated
      - run: pnpm test
      - run: pnpm --filter @tasknest/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Production build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: pnpm build:vercel
